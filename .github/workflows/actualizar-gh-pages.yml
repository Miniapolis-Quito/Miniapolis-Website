name: Actualizar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Preparar y publicar en rama gh-pages
        run: |
          node scripts/preparar-pages.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '_site' -exec rm -rf {} +
          cp -r _site/* _site/.nojekyll .
          rm -rf _site
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios para publicar."
          else
            git commit -m "deploy: actualiza GitHub Pages [skip ci]"
            git push --force origin gh-pages
          fi
