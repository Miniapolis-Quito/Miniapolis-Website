# Ejecuta la suite en cada empujón y en cada pull request.
name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La misma versión mínima que declara package.json.
          node-version: '20.11'
          cache: npm

      - run: npm ci

      # Las pruebas se ejecutan contra una base en memoria; no hace falta nada más.
      - run: npm test
