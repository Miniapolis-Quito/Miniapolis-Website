# Ejecuta la suite en cada empujón y en cada pull request.
name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:

# El flujo solo lee el código: el token de GitHub no necesita ningún otro permiso.
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Las acciones van fijadas a un commit y no a una etiqueta: una etiqueta
      # se puede mover, un commit no. El comentario dice a qué versión equivale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Las pruebas no empujan nada: no hace falta dejar la credencial en el disco.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # La misma versión mínima que declara package.json. Con Node 20 la
          # suite ni arrancaba: no entiende el patrón "tests/**/*.test.js".
          node-version: '22'
          cache: npm

      # GitHub no ofrece el escaneo de secretos en este repositorio privado. Esta
      # comprobación hace lo esencial: falla si se versiona un archivo que nunca
      # debe estar (configuración real, base de datos, certificados, pases) o
      # un secreto con forma reconocible (claves privadas, tokens de GitHub, AWS,
      # Slack, Google, SendGrid o Stripe). Los ejemplos y las pruebas no llevan
      # secretos reales y no se revisan por nombre, sí por contenido.
      - name: Busca secretos versionados
        run: |
          prohibidos=$(git ls-files | grep -E '(^|/)\.env$|\.(pem|p12|p8|key|db|sqlite|pkpass)$' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Archivos que nunca deben versionarse:"; echo "$prohibidos"; exit 1
          fi
          patron='BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}|AIza[0-9A-Za-z_-]{35}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|sk_live_[0-9A-Za-z]{24,}'
          if git grep -I -n -E "$patron" -- ':!package-lock.json' ':!.github/workflows/pruebas.yml'; then
            echo "::error::Hay algo con forma de secreto en el repositorio."; exit 1
          fi

      - run: npm ci

      # No se acepta integrar una dependencia con una vulnerabilidad conocida
      # de severidad alta o crítica. Se ejecuta después de `npm ci` para revisar
      # exactamente el árbol fijado por package-lock.json, incluidos los
      # paquetes de desarrollo que también se ejecutan en CI.
      - name: Audita dependencias
        run: npm audit --audit-level=high

      # Las pruebas se ejecutan contra una base en memoria; no hace falta nada más.
      - run: npm test
